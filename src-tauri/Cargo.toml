[package]
name = "mellow-client"
version = "0.1.0"
description = "Mellow desktop client"
edition = "2021"

[lib]
name = "mellow_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server", "http1"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
sha2 = "0.10"

# NOTE: cargo matches manifest target cfgs against rustc's built-in cfgs, which
# do NOT include `desktop` (tauri-build injects that for crate code only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-opener = "2"
wry = "0.55"
jni = "0.21"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
