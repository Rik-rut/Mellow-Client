<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8782" />
      <stop offset="100%" stop-color="#2D5A56" />
    </linearGradient>

    <!-- Discord Controller Primary Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3CD5B9" />
      <stop offset="60%" stop-color="#21A891" />
      <stop offset="100%" stop-color="#147B6A" />
    </linearGradient>

    <!-- Inner Face Shadow -->
    <linearGradient id="innerFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166658" />
      <stop offset="100%" stop-color="#0F4C41" />
    </linearGradient>

    <!-- Butterfly Wings Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FFF9" />
      <stop offset="40%" stop-color="#5BF2D3" />
      <stop offset="100%" stop-color="#1FA58E" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#092420" flood-opacity="0.45" />
    </filter>

    <!-- Glow Effect -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background Tile -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="109" fill="none" stroke="#68AB9F" stroke-width="3" opacity="0.35" />

  <!-- Soft Butterfly Wings Behind Controller -->
  <g filter="url(#tealGlow)" opacity="0.95">
    <!-- Left Wing Upper -->
    <path d="M 210 210 C 140 130 90 140 100 205 C 108 250 160 255 210 235 Z" fill="url(#wingGrad)" opacity="0.75" />
    <!-- Left Wing Lower -->
    <path d="M 205 235 C 135 250 120 300 155 320 C 185 330 210 285 215 250 Z" fill="url(#wingGrad)" opacity="0.6" />

    <!-- Right Wing Upper -->
    <path d="M 302 210 C 372 130 422 140 412 205 C 404 250 352 255 302 235 Z" fill="url(#wingGrad)" opacity="0.75" />
    <!-- Right Wing Lower -->
    <path d="M 307 235 C 377 250 392 300 357 320 C 327 330 302 285 297 250 Z" fill="url(#wingGrad)" opacity="0.6" />
  </g>

  <!-- Main Discord Gamepad Body -->
  <g filter="url(#dropShadow)">
    <path d="M 338 165 C 395 165 410 200 410 200 C 410 200 428 298 395 355 C 362 410 326 390 308 368 C 290 346 270 346 256 346 C 242 346 222 346 204 368 C 186 390 150 410 117 355 C 84 298 102 200 102 200 C 102 200 117 165 174 165 C 196 165 224 175 256 182 C 288 175 316 165 338 165 Z" 
          fill="url(#padGrad)" />
  </g>

  <!-- Top Head Arc Bevel -->
  <path d="M 178 172 C 197 172 225 182 256 189 C 287 182 315 172 334 172" 
        fill="none" stroke="#9EFFF0" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- Recessed Eye Cavities -->
  <ellipse cx="198" cy="272" rx="38" ry="46" fill="url(#innerFaceGrad)" />
  <ellipse cx="314" cy="272" rx="38" ry="46" fill="url(#innerFaceGrad)" />

  <!-- Left Glowing Mint Pupil -->
  <ellipse cx="203" cy="272" rx="22" ry="29" fill="#0FF5C7" />
  <ellipse cx="206" cy="265" rx="14" ry="18" fill="#FFFFFF" opacity="0.85" />
  <circle cx="212" cy="258" r="5" fill="#FFFFFF" />

  <!-- Right Glowing Mint Pupil -->
  <ellipse cx="309" cy="272" rx="22" ry="29" fill="#0FF5C7" />
  <ellipse cx="306" cy="265" rx="14" ry="18" fill="#FFFFFF" opacity="0.85" />
  <circle cx="312" cy="258" r="5" fill="#FFFFFF" />

  <!-- Controller Bottom Cheek Blush Marks -->
  <g opacity="0.45">
    <ellipse cx="152" cy="305" rx="14" ry="7" fill="#FFA5BD" transform="rotate(-8 152 305)" />
    <ellipse cx="360" cy="305" rx="14" ry="7" fill="#FFA5BD" transform="rotate(8 360 305)" />
  </g>
</svg>
